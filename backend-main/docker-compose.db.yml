services:
  db:
    image: postgres:16-alpine
    container_name: escalas_backend_db_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-112658}
      POSTGRES_DB: ${POSTGRES_DB:-backend}
    volumes:
      - postgres_backend_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-backend}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_backend_dev_data:
