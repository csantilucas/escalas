services:
  db:
    image: postgres:16-alpine
    container_name: alpha_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5006}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-112658}
      POSTGRES_DB: ${POSTGRES_DB:-backend}
      POSTGRES_PORT: 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-backend}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - alpha-net

  backend:
    build:
      context: ./backend-main
      dockerfile: Dockerfile
    container_name: alpha_backend
    extra_hosts:
      - "api.alphasoftware.com.br:192.168.1.101"
      - "app.alphasoftware.com.br:192.168.1.101"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5005}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      SERVER_IP: ${SERVER_IP:-localhost}
      FRONTEND_PORT: ${FRONTEND_PORT:-5004}
      BACKEND_PORT: ${BACKEND_PORT:-5005}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-112658}
      POSTGRES_DB: ${POSTGRES_DB:-backend}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-112658}@db:5432/${POSTGRES_DB:-backend}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-vgkv5wC$$aaafs0-a$$Q#qfajklwçvar}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://${SERVER_IP:-localhost}:${BACKEND_PORT:-5005}}
      JWT_SECRET_ACCESS_TOKEN: ${JWT_SECRET_ACCESS_TOKEN:-vgkv5wC$$aaafs0-a$$Q#qfajklwçvar}
      JWT_SECRET: ${JWT_SECRET:-vgkv5wC$$aaafs0-a$$Q#qfajklwçvar}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-15d}
      TOMTICKET_BEARER_TOKEN: ${TOMTICKET_BEARER_TOKEN:-6db3d0d76429766ec8d65e5f10b8e481}
      ALPHA_API_TOKEN: ${ALPHA_API_TOKEN:-}
      ZPRO_API_TOKEN: ${ZPRO_API_TOKEN:-}
      RUN_SEED: ${RUN_SEED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://${SERVER_IP:-localhost}:${FRONTEND_PORT:-5004},http://localhost:${FRONTEND_PORT:-5004},http://127.0.0.1:${FRONTEND_PORT:-5004}}
    networks:
      - alpha-net

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://${SERVER_IP:-localhost}:${BACKEND_PORT:-5005}}
    container_name: alpha_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5004}:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - SERVER_IP=${SERVER_IP:-localhost}
      - FRONTEND_PORT=${FRONTEND_PORT:-5004}
      - BACKEND_PORT=${BACKEND_PORT:-5005}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${SERVER_IP:-localhost}:${BACKEND_PORT:-5005}}
    networks:
      - alpha-net

networks:
  alpha-net:
    driver: bridge

volumes:
  postgres_data: